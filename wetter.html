<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wetter Dashboard</title>
    <style>
        /* Grundlegendes Design */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 3vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4vh; /* Flexibler Abstand zwischen den 3 Hauptbereichen */
            min-height: 100vh;
            user-select: none;
        }

        /* 1. Oberer Bereich: Flexibel für Tablet (nebeneinander) und Handy (untereinander) */
        #top-section {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        #current-weather {
            display: flex;
            flex-direction: column;
            width: 50%;
        }

        #current-details {
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        /* Responsive Schriftgrößen mit clamp(min, ideal, max) */
        .main-emoji { font-size: clamp(5rem, 10vw, 8rem); line-height: 1.2; }
        .main-temp { font-size: clamp(4rem, 8vw, 7rem); font-weight: bold; margin: 5px 0; }
        .location-name { font-size: clamp(2rem, 4vw, 3rem); font-weight: bold; }
        .weather-desc { font-size: clamp(1.2rem, 2.5vw, 2rem); color: #aaa; }
        
        .time-display { font-size: clamp(3rem, 6vw, 5rem); font-weight: bold; margin-bottom: 15px; }
        .detail-grid {
            display: grid;
            grid-template-columns: auto auto;
            gap: 15px 25px;
            font-size: clamp(1rem, 2vw, 1.5rem);
        }
        .detail-item { color: #ccc; }
        .detail-value { font-weight: bold; color: #fff; }

        /* 2. Mittlerer Bereich: Stunden (Scrollbar) */
        #middle-section {
            display: flex;
            overflow-x: auto;
            gap: 30px;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }
        #middle-section::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        
        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: clamp(1rem, 2vw, 1.5rem);
            min-width: max-content;
        }
        .hourly-item .emoji { font-size: clamp(2rem, 4vw, 3rem); margin: 10px 0; }

        /* 3. Unterer Bereich: Tage */
        #bottom-section {
            display: flex;
            justify-content: space-between;
            overflow-x: auto;
            gap: 15px;
            scrollbar-width: none;
        }
        #bottom-section::-webkit-scrollbar { display: none; }

        .daily-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 60px; /* Verhindert zu starkes Quetschen auf Handys */
            font-size: clamp(1rem, 2vw, 1.5rem);
        }
        .daily-item .emoji { font-size: clamp(2rem, 4vw, 3rem); margin: 10px 0; }
        .daily-item .temp-range { color: #aaa; font-size: clamp(0.9rem, 1.5vw, 1.2rem); text-align: center;}
        .daily-item .temp-max { color: #fff; font-weight: bold; }

        /* Handy-Anpassung (Hochformat) */
        @media (max-width: 768px) {
            #top-section {
                flex-direction: column;
                text-align: center;
                gap: 30px;
            }
            #current-weather, #current-details {
                width: 100%;
                align-items: center;
                text-align: center;
            }
            .detail-grid { text-align: center; }
            #bottom-section { justify-content: flex-start; }
        }

        /* Einstellungen-Button & Modal */
        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        #settings-btn.visible { opacity: 0.5; pointer-events: auto; }

        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .settings-box {
            background: #222;
            padding: 30px;
            border-radius: 15px;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        .settings-box input, .settings-box select {
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        .search-row { display: flex; gap: 10px; }
        .search-row button { flex-shrink: 0; }
        .settings-box button {
            font-size: 1.2rem;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .settings-box button.save-btn { margin-top: 20px; background: #28a745; }
    </style>
</head>
<body>

    <div id="settings-btn">⚙️</div>

    <div id="settings-modal">
        <div class="settings-box">
            <h2>Einstellungen</h2>
            
            <label>Ort suchen:</label>
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Stadt eingeben...">
                <button onclick="searchCity()">Suchen</button>
            </div>
            <select id="search-results" style="display: none;" onchange="applySearchResult()"></select>

            <hr style="border-color: #444; width: 100%; margin: 10px 0;">

            <label>Anzeigename (z.B. Zuhause):</label>
            <input type="text" id="input-name" value="Augsburg">
            
            <div class="search-row">
                <div style="width: 50%;">
                    <label>Breitengrad:</label>
                    <input type="number" id="input-lat" step="0.0001" value="48.3715">
                </div>
                <div style="width: 50%;">
                    <label>Längengrad:</label>
                    <input type="number" id="input-lon" step="0.0001" value="10.8985">
                </div>
            </div>
            
            <label>Vorschau-Tage (3-14):</label>
            <input type="number" id="input-days" min="3" max="14" value="7">

            <button class="save-btn" onclick="saveSettings()">Speichern & Schließen</button>
        </div>
    </div>

    <div id="top-section">
        <div id="current-weather">
            <div class="main-emoji" id="curr-emoji">☀️</div>
            <div class="main-temp" id="curr-temp">--°C</div>
            <div class="location-name" id="curr-name">Laden...</div>
            <div class="weather-desc" id="curr-desc">Bitte warten</div>
        </div>
        <div id="current-details">
            <div class="time-display" id="curr-time">--:--</div>
            <div class="detail-grid">
                <div class="detail-item">Luftfeuchte: <span class="detail-value" id="curr-hum">--%</span></div>
                <div class="detail-item">UV-Index: <span class="detail-value" id="curr-uv">--</span></div>
                <div class="detail-item">Aufgang: <span class="detail-value" id="curr-sunrise">--:--</span></div>
                <div class="detail-item">Untergang: <span class="detail-value" id="curr-sunset">--:--</span></div>
                <div class="detail-item">Mondphase: <span class="detail-value" id="curr-moon">🌑</span></div>
                <div class="detail-item">Vollmond: <span class="detail-value" id="next-full-moon">--.--.</span></div>
            </div>
        </div>
    </div>

    <div id="middle-section"></div>

    <div id="bottom-section"></div>

    <script>
        // --- 1. EINSTELLUNGEN ---
        let settings = {
            name: localStorage.getItem('wName') || 'Augsburg',
            lat: parseFloat(localStorage.getItem('wLat')) || 48.3715,
            lon: parseFloat(localStorage.getItem('wLon')) || 10.8985,
            days: parseInt(localStorage.getItem('wDays')) || 7
        };

        let foundCities = [];

        // Menü Interaktionen
        let btnTimeout;
        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#settings-modal')) return;
            const btn = document.getElementById('settings-btn');
            if (e.target.id === 'settings-btn') {
                openSettings();
                return;
            }
            btn.classList.add('visible');
            clearTimeout(btnTimeout);
            btnTimeout = setTimeout(() => btn.classList.remove('visible'), 3000);
        });

        function openSettings() {
            document.getElementById('input-name').value = settings.name;
            document.getElementById('input-lat').value = settings.lat;
            document.getElementById('input-lon').value = settings.lon;
            document.getElementById('input-days').value = settings.days;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            settings.name = document.getElementById('input-name').value;
            settings.lat = parseFloat(document.getElementById('input-lat').value);
            settings.lon = parseFloat(document.getElementById('input-lon').value);
            settings.days = parseInt(document.getElementById('input-days').value);

            localStorage.setItem('wName', settings.name);
            localStorage.setItem('wLat', settings.lat);
            localStorage.setItem('wLon', settings.lon);
            localStorage.setItem('wDays', settings.days);

            document.getElementById('settings-modal').style.display = 'none';
            fetchWeatherData();
        }

        // --- 2. ORTSSUCHE (Open-Meteo Geocoding) ---
        async function searchCity() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=de&format=json`);
                const data = await res.json();
                const select = document.getElementById('search-results');
                
                select.innerHTML = '<option value="">-- Bitte Ort wählen --</option>';
                if (data.results && data.results.length > 0) {
                    foundCities = data.results;
                    data.results.forEach((city, index) => {
                        const state = city.admin1 ? `, ${city.admin1}` : '';
                        const country = city.country ? ` (${city.country})` : '';
                        select.innerHTML += `<option value="${index}">${city.name}${state}${country}</option>`;
                    });
                    select.style.display = 'block';
                } else {
                    select.innerHTML = '<option value="">Kein Ort gefunden</option>';
                    select.style.display = 'block';
                }
            } catch (err) {
                console.error("Fehler bei der Ortssuche", err);
            }
        }

        function applySearchResult() {
            const index = document.getElementById('search-results').value;
            if (index === "") return;
            const city = foundCities[index];
            
            document.getElementById('input-name').value = city.name;
            document.getElementById('input-lat').value = city.latitude.toFixed(4);
            document.getElementById('input-lon').value = city.longitude.toFixed(4);
        }

        // --- 3. UHR & MOND ---
        function updateClock() {
            const now = new Date();
            document.getElementById('curr-time').innerText = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getEmojiAndText(wmoCode, isDay) {
            const codes = {
                0:  { day: '☀️', night: '🌙', text: 'Klar' },
                1:  { day: '🌤️', night: '☁️', text: 'Überwiegend klar' },
                2:  { day: '⛅', night: '☁️', text: 'Teilweise bewölkt' },
                3:  { day: '☁️', night: '☁️', text: 'Bewölkt' },
                45: { day: '🌫️', night: '🌫️', text: 'Nebel' },
                48: { day: '🌫️', night: '🌫️', text: 'Raureifnebel' },
                51: { day: '🌦️', night: '🌧️', text: 'Leichter Nieselregen' },
                53: { day: '🌧️', night: '🌧️', text: 'Nieselregen' },
                55: { day: '🌧️', night: '🌧️', text: 'Dichter Nieselregen' },
                61: { day: '🌦️', night: '🌧️', text: 'Leichter Regen' },
                63: { day: '🌧️', night: '🌧️', text: 'Regen' },
                65: { day: '🌧️', night: '🌧️', text: 'Starker Regen' },
                71: { day: '🌨️', night: '🌨️', text: 'Leichter Schneefall' },
                73: { day: '❄️', night: '❄️', text: 'Schneefall' },
                75: { day: '❄️', night: '❄️', text: 'Starker Schneefall' },
                95: { day: '⛈️', night: '⛈️', text: 'Gewitter' },
                96: { day: '⛈️', night: '⛈️', text: 'Gewitter mit Hagel' },
                99: { day: '⛈️', night: '⛈️', text: 'Schweres Gewitter' }
            };
            const match = codes[wmoCode] || { day: '❓', night: '❓', text: 'Unbekannt' };
            return { emoji: isDay ? match.day : match.night, text: match.text };
        }

        function calculateMoonPhase(lat) {
            const now = new Date();
            const knownNewMoon = new Date('2024-01-11T11:57:00Z');
            const lunarCycle = 29.53058867;
            
            const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
            const cycleDays = diffDays % lunarCycle;
            
            let daysToFullMoon = 14.765 - cycleDays;
            if (daysToFullMoon < 0) daysToFullMoon += lunarCycle;
            const nextFullMoonDate = new Date(now.getTime() + (daysToFullMoon * 24 * 60 * 60 * 1000));
            document.getElementById('next-full-moon').innerText = nextFullMoonDate.toLocaleDateString('de-DE');

            const phase = Math.floor((cycleDays / lunarCycle) * 8 + 0.5) % 8;
            let phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            if (lat < 0) phases = ['🌑', '🌘', '🌗', '🌖', '🌕', '🌔', '🌓', '🌒'];
            
            document.getElementById('curr-moon').innerText = phases[phase];
        }

        // --- 4. WETTER DATEN ABRUFEN ---
        async function fetchWeatherData() {
            document.getElementById('curr-name').innerText = settings.name;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${settings.lat}&longitude=${settings.lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=${settings.days}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                // Aktuelles Wetter
                const curr = data.current;
                const weatherInfo = getEmojiAndText(curr.weather_code, curr.is_day === 1);
                document.getElementById('curr-emoji').innerText = weatherInfo.emoji;
                document.getElementById('curr-temp').innerText = Math.round(curr.temperature_2m) + '°C';
                document.getElementById('curr-desc').innerText = weatherInfo.text;
                document.getElementById('curr-hum').innerText = curr.relative_humidity_2m + '%';
                
                // Details
                const today = data.daily;
                document.getElementById('curr-uv').innerText = today.uv_index_max[0] ? today.uv_index_max[0].toFixed(1) : '--';
                
                const formatTime = (isoString) => new Date(isoString).toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('curr-sunrise').innerText = formatTime(today.sunrise[0]);
                document.getElementById('curr-sunset').innerText = formatTime(today.sunset[0]);

                calculateMoonPhase(settings.lat);

                // Stunden (nächste 12 Stunden)
                const hourlyContainer = document.getElementById('middle-section');
                hourlyContainer.innerHTML = '';
                const currentHourIndex = data.hourly.time.findIndex(t => new Date(t) > new Date());
                
                for (let i = currentHourIndex; i < currentHourIndex + 12; i++) {
                    const time = new Date(data.hourly.time[i]);
                    const hourStr = time.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const isDay = data.hourly.is_day[i] === 1;
                    const e = getEmojiAndText(data.hourly.weather_code[i], isDay).emoji;

                    hourlyContainer.innerHTML += `
                        <div class="hourly-item">
                            <div>${hourStr}</div>
                            <div class="emoji">${e}</div>
                            <div>${temp}°C</div>
                        </div>
                    `;
                }

                // Tage
                const dailyContainer = document.getElementById('bottom-section');
                dailyContainer.innerHTML = '';
                const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                
                for (let i = 0; i < settings.days; i++) {
                    const date = new Date(today.time[i]);
                    const dayName = i === 0 ? 'Heute' : weekdays[date.getDay()];
                    const tMin = Math.round(today.temperature_2m_min[i]);
                    const tMax = Math.round(today.temperature_2m_max[i]);
                    const e = getEmojiAndText(today.weather_code[i], true).emoji;

                    dailyContainer.innerHTML += `
                        <div class="daily-item">
                            <div>${dayName}</div>
                            <div class="emoji">${e}</div>
                            <div class="temp-range"><span class="temp-max">${tMax}°</span> / ${tMin}°</div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Fehler beim Abrufen der Wetterdaten:", error);
                document.getElementById('curr-desc').innerText = "Fehler beim Laden!";
            }
        }

        // Start
        fetchWeatherData();
        setInterval(fetchWeatherData, 5 * 60 * 1000);
    </script>
</body>
</html>
