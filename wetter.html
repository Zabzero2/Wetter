<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wetter Dashboard</title>
    <style>
        /* Grundlegendes Design: Schwarzer Hintergrund, weiße Schrift, kein Scrollen */
        body {
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 2vw;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Layout der drei Hauptbereiche */
        #top-section {
            display: flex;
            height: 50%;
            justify-content: space-between;
        }
        #middle-section {
            height: 20%;
            display: flex;
            align-items: center;
            overflow-x: auto; /* Scrollbar für Stunden */
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }
        #middle-section::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }
        #bottom-section {
            height: 30%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Oberer Bereich Links: Aktuelles Wetter */
        #current-weather {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 50%;
        }
        .main-emoji { font-size: 8rem; line-height: 1; }
        .main-temp { font-size: 6rem; font-weight: bold; margin: 10px 0; }
        .location-name { font-size: 3rem; font-weight: bold; }
        .weather-desc { font-size: 2rem; color: #aaa; }

        /* Oberer Bereich Rechts: Details */
        #current-details {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            text-align: right;
        }
        .time-display { font-size: 5rem; font-weight: bold; margin-bottom: 20px; }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            font-size: 1.5rem;
            text-align: right;
        }
        .detail-item { color: #ccc; }
        .detail-value { font-weight: bold; color: #fff; }

        /* Mittlerer Bereich: Stunden */
        .hourly-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-right: 40px;
            font-size: 1.5rem;
        }
        .hourly-item .emoji { font-size: 2.5rem; margin: 10px 0; }

        /* Unterer Bereich: Tage */
        .daily-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            font-size: 1.5rem;
        }
        .daily-item .emoji { font-size: 3rem; margin: 10px 0; }
        .daily-item .temp-range { color: #aaa; font-size: 1.2rem; }
        .daily-item .temp-max { color: #fff; font-weight: bold; }

        /* Versteckter Einstellungs-Button */
        #settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 3rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
        }
        #settings-btn.visible {
            opacity: 0.5;
            pointer-events: auto;
        }

        /* Einstellungs-Modal */
        #settings-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .settings-box {
            background: #222;
            padding: 40px;
            border-radius: 15px;
            font-size: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 50%;
        }
        .settings-box input {
            font-size: 1.5rem;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #333;
            color: #fff;
        }
        .settings-box button {
            font-size: 1.5rem;
            padding: 15px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="settings-btn">⚙️</div>

    <div id="settings-modal">
        <div class="settings-box">
            <h2>Einstellungen</h2>
            <label>Anzeigename (z.B. Zuhause):</label>
            <input type="text" id="input-name" value="Zuhause">
            
            <label>Breitengrad (Latitude):</label>
            <input type="number" id="input-lat" step="0.0001" value="48.3715">
            
            <label>Längengrad (Longitude):</label>
            <input type="number" id="input-lon" step="0.0001" value="10.8985">
            
            <label>Vorschau-Tage (3-10):</label>
            <input type="number" id="input-days" min="3" max="10" value="7">

            <button onclick="saveSettings()">Speichern & Schließen</button>
        </div>
    </div>

    <div id="top-section">
        <div id="current-weather">
            <div class="main-emoji" id="curr-emoji">☀️</div>
            <div class="main-temp" id="curr-temp">--°C</div>
            <div class="location-name" id="curr-name">Zuhause</div>
            <div class="weather-desc" id="curr-desc">Wird geladen...</div>
        </div>
        <div id="current-details">
            <div class="time-display" id="curr-time">--:--</div>
            <div class="detail-grid">
                <div class="detail-item">Luftfeuchte: <span class="detail-value" id="curr-hum">--%</span></div>
                <div class="detail-item">UV-Index: <span class="detail-value" id="curr-uv">--</span></div>
                <div class="detail-item">Sonnenaufgang: <span class="detail-value" id="curr-sunrise">--:--</span></div>
                <div class="detail-item">Sonnenuntergang: <span class="detail-value" id="curr-sunset">--:--</span></div>
                <div class="detail-item">Mondphase: <span class="detail-value" id="curr-moon">🌑</span></div>
                <div class="detail-item" style="grid-column: span 2;">Nächster Vollmond: <span class="detail-value" id="next-full-moon">--.--.----</span></div>
            </div>
        </div>
    </div>

    <div id="middle-section" id="hourly-container">
        </div>

    <div id="bottom-section" id="daily-container">
        </div>

    <script>
        // --- 1. EINSTELLUNGEN & STANDARTWERTE ---
        let settings = {
            name: localStorage.getItem('wName') || 'Augsburg',
            lat: parseFloat(localStorage.getItem('wLat')) || 48.3715,
            lon: parseFloat(localStorage.getItem('wLon')) || 10.8985,
            days: parseInt(localStorage.getItem('wDays')) || 7
        };

        // UI-Interaktionen (Klick für Menü)
        let btnTimeout;
        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#settings-modal')) return;
            const btn = document.getElementById('settings-btn');
            if (e.target.id === 'settings-btn') {
                showSettingsModal();
                return;
            }
            btn.classList.add('visible');
            clearTimeout(btnTimeout);
            btnTimeout = setTimeout(() => {
                btn.classList.remove('visible');
            }, 3000);
        });

        function showSettingsModal() {
            document.getElementById('input-name').value = settings.name;
            document.getElementById('input-lat').value = settings.lat;
            document.getElementById('input-lon').value = settings.lon;
            document.getElementById('input-days').value = settings.days;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            settings.name = document.getElementById('input-name').value;
            settings.lat = parseFloat(document.getElementById('input-lat').value);
            settings.lon = parseFloat(document.getElementById('input-lon').value);
            settings.days = parseInt(document.getElementById('input-days').value);

            localStorage.setItem('wName', settings.name);
            localStorage.setItem('wLat', settings.lat);
            localStorage.setItem('wLon', settings.lon);
            localStorage.setItem('wDays', settings.days);

            document.getElementById('settings-modal').style.display = 'none';
            document.getElementById('curr-name').innerText = settings.name;
            fetchWeatherData();
        }

        // --- 2. HILFSFUNKTIONEN (Uhrzeit, Mond, WMO Codes) ---
        function updateClock() {
            const now = new Date();
            document.getElementById('curr-time').innerText = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getEmojiAndText(wmoCode, isDay) {
            const codes = {
                0:  { day: '☀️', night: '🌙', text: 'Klar' },
                1:  { day: '🌤️', night: '☁️', text: 'Überwiegend klar' },
                2:  { day: '⛅', night: '☁️', text: 'Teilweise bewölkt' },
                3:  { day: '☁️', night: '☁️', text: 'Bewölkt' },
                45: { day: '🌫️', night: '🌫️', text: 'Nebel' },
                48: { day: '🌫️', night: '🌫️', text: 'Raureifnebel' },
                51: { day: '🌦️', night: '🌧️', text: 'Leichter Nieselregen' },
                53: { day: '🌧️', night: '🌧️', text: 'Nieselregen' },
                55: { day: '🌧️', night: '🌧️', text: 'Dichter Nieselregen' },
                61: { day: '🌦️', night: '🌧️', text: 'Leichter Regen' },
                63: { day: '🌧️', night: '🌧️', text: 'Regen' },
                65: { day: '🌧️', night: '🌧️', text: 'Starker Regen' },
                71: { day: '🌨️', night: '🌨️', text: 'Leichter Schneefall' },
                73: { day: '❄️', night: '❄️', text: 'Schneefall' },
                75: { day: '❄️', night: '❄️', text: 'Starker Schneefall' },
                95: { day: '⛈️', night: '⛈️', text: 'Gewitter' },
                96: { day: '⛈️', night: '⛈️', text: 'Gewitter mit Hagel' },
                99: { day: '⛈️', night: '⛈️', text: 'Schweres Gewitter' }
            };
            const match = codes[wmoCode] || { day: '❓', night: '❓', text: 'Unbekannt' };
            return { emoji: isDay ? match.day : match.night, text: match.text };
        }

        // Mondphasen Berechnung (Geniale Logik mit Emoji-Tausch für Südhalbkugel)
        function calculateMoonPhase(lat) {
            const now = new Date();
            // Bekannter Neumond: 11. Jan 2024
            const knownNewMoon = new Date('2024-01-11T11:57:00Z');
            const lunarCycle = 29.53058867; // Tage pro Zyklus
            
            const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
            const cycleDays = diffDays % lunarCycle;
            
            // Nächster Vollmond (Vollmond ist bei Zyklustag 14.765)
            let daysToFullMoon = 14.765 - cycleDays;
            if (daysToFullMoon < 0) daysToFullMoon += lunarCycle;
            const nextFullMoonDate = new Date(now.getTime() + (daysToFullMoon * 24 * 60 * 60 * 1000));
            document.getElementById('next-full-moon').innerText = nextFullMoonDate.toLocaleDateString('de-DE');

            // Phase bestimmen (0 bis 7)
            const phase = Math.floor((cycleDays / lunarCycle) * 8 + 0.5) % 8;
            
            // Standard Emojis (Nordhalbkugel)
            let phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            
            // Anpassung Südhalbkugel (Zunehmend und Abnehmend vertauschen)
            if (lat < 0) {
                phases = ['🌑', '🌘', '🌗', '🌖', '🌕', '🌔', '🌓', '🌒'];
            }
            
            document.getElementById('curr-moon').innerText = phases[phase];
        }

        // --- 3. DATENABRUF (Open-Meteo) ---
        async function fetchWeatherData() {
            document.getElementById('curr-name').innerText = settings.name;
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${settings.lat}&longitude=${settings.lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code&hourly=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max&timezone=auto&forecast_days=${settings.days}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                // 1. Aktuelles Wetter setzen
                const curr = data.current;
                const weatherInfo = getEmojiAndText(curr.weather_code, curr.is_day === 1);
                document.getElementById('curr-emoji').innerText = weatherInfo.emoji;
                document.getElementById('curr-temp').innerText = Math.round(curr.temperature_2m) + '°C';
                document.getElementById('curr-desc').innerText = weatherInfo.text;
                document.getElementById('curr-hum').innerText = curr.relative_humidity_2m + '%';
                
                // Details setzen
                const today = data.daily;
                document.getElementById('curr-uv').innerText = today.uv_index_max[0] ? today.uv_index_max[0].toFixed(1) : '--';
                
                // Zeit formatieren für Sonnenauf-/untergang
                const formatTime = (isoString) => new Date(isoString).toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('curr-sunrise').innerText = formatTime(today.sunrise[0]);
                document.getElementById('curr-sunset').innerText = formatTime(today.sunset[0]);

                calculateMoonPhase(settings.lat);

                // 2. Stundenvorschau (Nächste 12 Stunden)
                const hourlyContainer = document.getElementById('middle-section');
                hourlyContainer.innerHTML = ''; // Leeren
                
                const currentHourIndex = data.hourly.time.findIndex(t => new Date(t) > new Date());
                for (let i = currentHourIndex; i < currentHourIndex + 12; i++) {
                    const time = new Date(data.hourly.time[i]);
                    const hourStr = time.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const isDay = data.hourly.is_day[i] === 1;
                    const e = getEmojiAndText(data.hourly.weather_code[i], isDay).emoji;

                    hourlyContainer.innerHTML += `
                        <div class="hourly-item">
                            <div>${hourStr}</div>
                            <div class="emoji">${e}</div>
                            <div>${temp}°C</div>
                        </div>
                    `;
                }

                // 3. Tagesvorschau
                const dailyContainer = document.getElementById('bottom-section');
                dailyContainer.innerHTML = ''; // Leeren
                
                const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                for (let i = 0; i < settings.days; i++) {
                    const date = new Date(today.time[i]);
                    const dayName = i === 0 ? 'Heute' : weekdays[date.getDay()];
                    const tMin = Math.round(today.temperature_2m_min[i]);
                    const tMax = Math.round(today.temperature_2m_max[i]);
                    const e = getEmojiAndText(today.weather_code[i], true).emoji; // Für Tage immer Tag-Emoji nehmen

                    dailyContainer.innerHTML += `
                        <div class="daily-item">
                            <div>${dayName}</div>
                            <div class="emoji">${e}</div>
                            <div class="temp-range"><span class="temp-max">${tMax}°</span> / ${tMin}°</div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Fehler beim Abrufen der Wetterdaten:", error);
                document.getElementById('curr-desc').innerText = "Fehler beim Laden!";
            }
        }

        // Initiale Ladung & 5-Minuten-Intervall
        fetchWeatherData();
        setInterval(fetchWeatherData, 5 * 60 * 1000);

    </script>
</body>
</html>
