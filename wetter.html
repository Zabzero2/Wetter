<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wetter Dashboard</title>
    <style>
        /* Grundlegendes Design & Typografie */
        body {
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
            margin: 0;
            padding: 2.5vh 3vw;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
            height: 100vh;
            user-select: none;
            overflow: hidden;
        }

        /* Die Kacheln (Cards) */
        .card {
            background-color: rgba(30, 30, 32, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 2.5vh 2vw;
            box-sizing: border-box;
            display: flex;
        }

        /* --- KOPFZEILE (Uhrzeit & Datum) --- */
        #header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 1vw;
            height: 12vh;
        }
        #header-time {
            font-size: clamp(4rem, 8vw, 7rem);
            font-weight: 700;
            line-height: 0.8;
            letter-spacing: -2px;
        }
        #header-date {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #a0a0a5;
            font-weight: 500;
            margin-bottom: 0.5vh;
        }

        /* --- TOP ROW (3 Kacheln nebeneinander) --- */
        #top-row {
            display: flex;
            gap: 2vw;
            height: 32vh;
        }

        /* 1. Aktuelles Wetter */
        #card-current {
            flex: 1.2;
            align-items: center;
            gap: 2vw;
        }
        .main-emoji { font-size: clamp(6rem, 10vw, 9rem); line-height: 1; text-shadow: 0 0 20px rgba(255,255,255,0.1); }
        .current-info { display: flex; flex-direction: column; justify-content: center; }
        .main-temp { font-size: clamp(3rem, 6vw, 5rem); font-weight: bold; line-height: 1; margin-bottom: 5px; }
        .location-name { font-size: clamp(1.5rem, 2.5vw, 2.2rem); font-weight: 600; color: #fff; }
        .weather-desc { font-size: clamp(1.1rem, 1.8vw, 1.5rem); color: #a0a0a5; margin-top: 3px;}

        /* 2. Details (Icons & Werte) */
        #card-details {
            flex: 1;
            align-items: center;
            justify-content: center;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vh 2vw;
            width: 100%;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: clamp(1.3rem, 2.2vw, 1.8rem);
        }
        .detail-icon { font-size: clamp(1.5rem, 2.5vw, 2rem); opacity: 0.8; }
        .detail-value { font-weight: 600; color: #fff; }

        /* 3. Mondphase */
        #card-moon {
            flex: 0.8;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .moon-emoji { font-size: clamp(4rem, 7vw, 6rem); line-height: 1; margin-bottom: 10px; }
        .moon-status { font-size: clamp(1.2rem, 2vw, 1.6rem); font-weight: 600; color: #fff; margin-bottom: 5px; }
        .moon-next-label { font-size: clamp(0.9rem, 1.5vw, 1.1rem); color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .moon-next-date { font-size: clamp(1.1rem, 1.8vw, 1.4rem); color: #fff; font-weight: 600; }

        /* --- MIDDLE ROW (Stunden) --- */
        #card-hourly {
            height: 22vh;
            overflow-x: auto;
            gap: 4vw;
            align-items: center;
            scrollbar-width: none;
        }
        #card-hourly::-webkit-scrollbar { display: none; }
        .hourly-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: max-content;
        }
        .hourly-time { font-size: clamp(1.1rem, 1.8vw, 1.4rem); color: #a0a0a5; font-weight: 500; }
        .hourly-emoji { font-size: clamp(2rem, 3.5vw, 2.8rem); margin: 1vh 0; }
        .hourly-temp { font-size: clamp(1.3rem, 2vw, 1.6rem); font-weight: 600; color: #fff; }

        /* --- BOTTOM ROW (Tage) --- */
        #card-daily {
            height: 25vh;
            overflow-x: auto;
            justify-content: space-between;
            align-items: center;
            gap: 2vw;
            scrollbar-width: none;
        }
        #card-daily::-webkit-scrollbar { display: none; }
        .daily-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 60px;
        }
        .daily-day { font-size: clamp(1.2rem, 2vw, 1.5rem); font-weight: 600; color: #fff; }
        .daily-emoji { font-size: clamp(2.2rem, 4vw, 3.2rem); margin: 1vh 0; }
        .daily-temps { display: flex; gap: 8px; font-size: clamp(1.2rem, 2vw, 1.5rem); }
        .temp-max { color: #fff; font-weight: bold; }
        .temp-min { color: #888; font-weight: 500; }

        /* --- HANDY ANPASSUNG (Hochformat) --- */
        @media (max-width: 900px) {
            body { overflow-y: auto; overflow-x: hidden; height: auto; gap: 20px; padding: 20px; }
            #header-section { height: auto; flex-direction: column; align-items: center; text-align: center; gap: 10px; margin-bottom: 10px; }
            #top-row { flex-direction: column; height: auto; gap: 20px; }
            #card-current, #card-details, #card-moon { padding: 30px; justify-content: center; text-align: center; }
            #card-current { flex-direction: column; gap: 15px; }
            .detail-grid { display: flex; flex-direction: column; align-items: center; gap: 15px; }
            #card-hourly, #card-daily { height: auto; padding: 30px 20px; justify-content: flex-start; }
        }

        /* --- EINSTELLUNGEN BUTTON & MODAL --- */
        #settings-btn {
            position: fixed;
            top: 2.5vh;
            right: 3vw;
            font-size: 2rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 50%;
        }
        #settings-btn.visible { opacity: 0.6; pointer-events: auto; }

        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        .settings-box {
            background: #1c1c1e;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 20px;
            font-size: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 500px;
        }
        .settings-box input, .settings-box select {
            font-size: 1.2rem;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #2c2c2e;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
        }
        .search-row { display: flex; gap: 10px; }
        .search-row button { flex-shrink: 0; }
        .settings-box button {
            font-size: 1.2rem;
            font-weight: bold;
            padding: 14px;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: inherit;
        }
        .settings-box button.save-btn { margin-top: 20px; background: #30d158; }
    </style>
</head>
<body>

    <div id="settings-btn">⚙️</div>

    <div id="settings-modal">
        <div class="settings-box">
            <h2 style="margin-top:0;">Einstellungen</h2>
            
            <label>Ort suchen:</label>
            <div class="search-row">
                <input type="text" id="search-input" placeholder="Stadt eingeben...">
                <button onclick="searchCity()">Suchen</button>
            </div>
            <select id="search-results" style="display: none;" onchange="applySearchResult()"></select>

            <hr style="border-color: #333; width: 100%; margin: 10px 0;">

            <label>Anzeigename (z.B. Zuhause):</label>
            <input type="text" id="input-name" value="Augsburg">
            
            <div class="search-row">
                <div style="width: 50%;">
                    <label>Breitengrad:</label>
                    <input type="number" id="input-lat" step="0.0001" value="48.3715">
                </div>
                <div style="width: 50%;">
                    <label>Längengrad:</label>
                    <input type="number" id="input-lon" step="0.0001" value="10.8985">
                </div>
            </div>
            
            <label>Vorschau-Tage (3-14):</label>
            <input type="number" id="input-days" min="3" max="14" value="7">

            <button class="save-btn" onclick="saveSettings()">Speichern & Schließen</button>
        </div>
    </div>

    <div id="header-section">
        <div id="header-time">--:--</div>
        <div id="header-date">Lade Datum...</div>
    </div>

    <div id="top-row">
        <div class="card" id="card-current">
            <div class="main-emoji" id="curr-emoji">☀️</div>
            <div class="current-info">
                <div class="main-temp" id="curr-temp">--°C</div>
                <div class="location-name" id="curr-name">Laden...</div>
                <div class="weather-desc" id="curr-desc">Bitte warten</div>
            </div>
        </div>

        <div class="card" id="card-details">
            <div class="detail-grid">
                <div class="detail-item"><span class="detail-icon">💧</span><span class="detail-value" id="curr-hum">--%</span></div>
                <div class="detail-item"><span class="detail-icon">☀️</span><span class="detail-value" id="curr-uv">--</span></div>
                <div class="detail-item"><span class="detail-icon">🌅</span><span class="detail-value" id="curr-sunrise">--:--</span></div>
                <div class="detail-item"><span class="detail-icon">🌇</span><span class="detail-value" id="curr-sunset">--:--</span></div>
            </div>
        </div>

        <div class="card" id="card-moon">
            <div class="moon-emoji" id="curr-moon">🌑</div>
            <div class="moon-status" id="moon-status">Berechne...</div>
            <div class="moon-next-label">Nächster Vollmond</div>
            <div class="moon-next-date" id="next-full-moon">--.--.</div>
        </div>
    </div>

    <div class="card" id="card-hourly"></div>

    <div class="card" id="card-daily"></div>

    <script>
        // --- 1. EINSTELLUNGEN ---
        let settings = {
            name: localStorage.getItem('wName') || 'Meitingen',
            lat: parseFloat(localStorage.getItem('wLat')) || 48.5447,
            lon: parseFloat(localStorage.getItem('wLon')) || 10.8494,
            days: parseInt(localStorage.getItem('wDays')) || 7
        };

        let foundCities = [];

        // Menü Interaktionen
        let btnTimeout;
        document.body.addEventListener('click', (e) => {
            if (e.target.closest('#settings-modal')) return;
            const btn = document.getElementById('settings-btn');
            if (e.target.id === 'settings-btn') {
                openSettings();
                return;
            }
            btn.classList.add('visible');
            clearTimeout(btnTimeout);
            btnTimeout = setTimeout(() => btn.classList.remove('visible'), 3000);
        });

        function openSettings() {
            document.getElementById('input-name').value = settings.name;
            document.getElementById('input-lat').value = settings.lat;
            document.getElementById('input-lon').value = settings.lon;
            document.getElementById('input-days').value = settings.days;
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function saveSettings() {
            settings.name = document.getElementById('input-name').value;
            settings.lat = parseFloat(document.getElementById('input-lat').value);
            settings.lon = parseFloat(document.getElementById('input-lon').value);
            settings.days = parseInt(document.getElementById('input-days').value);

            localStorage.setItem('wName', settings.name);
            localStorage.setItem('wLat', settings.lat);
            localStorage.setItem('wLon', settings.lon);
            localStorage.setItem('wDays', settings.days);

            document.getElementById('settings-modal').style.display = 'none';
            fetchWeatherData();
        }

        // --- 2. ORTSSUCHE ---
        async function searchCity() {
            const query = document.getElementById('search-input').value;
            if (!query) return;
            
            try {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=de&format=json`);
                const data = await res.json();
                const select = document.getElementById('search-results');
                
                select.innerHTML = '<option value="">-- Bitte Ort wählen --</option>';
                if (data.results && data.results.length > 0) {
                    foundCities = data.results;
                    data.results.forEach((city, index) => {
                        const state = city.admin1 ? `, ${city.admin1}` : '';
                        const country = city.country ? ` (${city.country})` : '';
                        select.innerHTML += `<option value="${index}">${city.name}${state}${country}</option>`;
                    });
                    select.style.display = 'block';
                } else {
                    select.innerHTML = '<option value="">Kein Ort gefunden</option>';
                    select.style.display = 'block';
                }
            } catch (err) {
                console.error("Fehler bei der Ortssuche", err);
            }
        }

        function applySearchResult() {
            const index = document.getElementById('search-results').value;
            if (index === "") return;
            const city = foundCities[index];
            
            document.getElementById('input-name').value = city.name;
            document.getElementById('input-lat').value = city.latitude.toFixed(4);
            document.getElementById('input-lon').value = city.longitude.toFixed(4);
        }

        // --- 3. UHR, DATUM, MOND & WETTER-CODES ---
        function updateClock() {
            const now = new Date();
            // Uhrzeit
            document.getElementById('header-time').innerText = now.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
            // Datum (z.B. "Mittwoch, 10. Juni")
            const dateOptions = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('header-date').innerText = now.toLocaleDateString('de-DE', dateOptions);
        }
        setInterval(updateClock, 1000);
        updateClock();

        function getEmojiAndText(wmoCode, isDay) {
            const codes = {
                0:  { day: '☀️', night: '🌙', text: 'Klar' },
                1:  { day: '🌤️', night: '☁️', text: 'Überwiegend klar' },
                2:  { day: '⛅', night: '☁️', text: 'Teilweise bewölkt' },
                3:  { day: '☁️', night: '☁️', text: 'Bedeckt' },
                45: { day: '🌫️', night: '🌫️', text: 'Nebel' },
                48: { day: '🌫️', night: '🌫️', text: 'Raureifnebel' },
                51: { day: '🌦️', night: '🌧️', text: 'Leichter Nieselregen' },
                53: { day: '🌧️', night: '🌧️', text: 'Mäßiger Nieselregen' },
                55: { day: '🌧️', night: '🌧️', text: 'Dichter Nieselregen' },
                56: { day: '🌧️', night: '🌧️', text: 'Gefrierender Nieselregen' },
                57: { day: '🌧️', night: '🌧️', text: 'Dichter gefrier. Nieselregen' },
                61: { day: '🌦️', night: '🌧️', text: 'Leichter Regen' },
                63: { day: '🌧️', night: '🌧️', text: 'Mäßiger Regen' },
                65: { day: '🌧️', night: '🌧️', text: 'Starker Regen' },
                66: { day: '🌧️', night: '🌧️', text: 'Gefrierender Regen' },
                67: { day: '🌧️', night: '🌧️', text: 'Starker gefrier. Regen' },
                71: { day: '🌨️', night: '🌨️', text: 'Leichter Schneefall' },
                73: { day: '❄️', night: '❄️', text: 'Mäßiger Schneefall' },
                75: { day: '❄️', night: '❄️', text: 'Starker Schneefall' },
                77: { day: '🌨️', night: '🌨️', text: 'Schneegriesel' },
                80: { day: '🌦️', night: '🌧️', text: 'Leichte Regenschauer' },
                81: { day: '🌧️', night: '🌧️', text: 'Mäßige Regenschauer' },
                82: { day: '🌧️', night: '🌧️', text: 'Heftige Regenschauer' },
                85: { day: '🌨️', night: '🌨️', text: 'Leichte Schneeschauer' },
                86: { day: '❄️', night: '❄️', text: 'Starke Schneeschauer' },
                95: { day: '⛈️', night: '⛈️', text: 'Gewitter' },
                96: { day: '⛈️', night: '⛈️', text: 'Gewitter mit Hagel' },
                99: { day: '⛈️', night: '⛈️', text: 'Schweres Gewitter' }
            };
            const match = codes[wmoCode] || { day: '☁️', night: '☁️', text: 'Wetter unbekannt' };
            return { emoji: isDay ? match.day : match.night, text: match.text };
        }

        function calculateMoonPhase(lat) {
            const now = new Date();
            const knownNewMoon = new Date('2024-01-11T11:57:00Z');
            const lunarCycle = 29.53058867;
            
            const diffDays = (now - knownNewMoon) / (1000 * 60 * 60 * 24);
            const cycleDays = diffDays % lunarCycle;
            
            let daysToFullMoon = 14.765 - cycleDays;
            if (daysToFullMoon < 0) daysToFullMoon += lunarCycle;
            const nextFullMoonDate = new Date(now.getTime() + (daysToFullMoon * 24 * 60 * 60 * 1000));
            document.getElementById('next-full-moon').innerText = nextFullMoonDate.toLocaleDateString('de-DE');

            let statusText = "";
            if (cycleDays < 1 || cycleDays > 28.5) statusText = "Neumond";
            else if (cycleDays > 13.8 && cycleDays < 15.8) statusText = "Vollmond";
            else if (cycleDays < 14.765) statusText = "Zunehmend";
            else statusText = "Abnehmend";
            document.getElementById('moon-status').innerText = statusText;

            const phase = Math.floor((cycleDays / lunarCycle) * 8 + 0.5) % 8;
            let phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            if (lat < 0) phases = ['🌑', '🌘', '🌗', '🌖', '🌕', '🌔', '🌓', '🌒'];
            document.getElementById('curr-moon').innerText = phases[phase];
        }

        // --- 4. WETTER DATEN ABRUFEN ---
        async function fetchWeatherData() {
            document.getElementById('curr-name').innerText = settings.name;
            
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${settings.lat}&longitude=${settings.lon}&current=temperature_2m,relative_humidity_2m,is_day,weather_code&hourly=temperature_2m,weather_code,is_day,uv_index&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto&forecast_days=${settings.days}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                // Aktuelles Wetter
                const curr = data.current;
                const weatherInfo = getEmojiAndText(curr.weather_code, curr.is_day === 1);
                document.getElementById('curr-emoji').innerText = weatherInfo.emoji;
                document.getElementById('curr-temp').innerText = Math.round(curr.temperature_2m) + '°C';
                document.getElementById('curr-desc').innerText = weatherInfo.text;
                document.getElementById('curr-hum').innerText = curr.relative_humidity_2m + '%';
                
                // UV Index (stundengenau)
                const now = new Date();
                let currentHourIndex = data.hourly.time.findIndex(t => {
                    const d = new Date(t);
                    return d.getDate() === now.getDate() && d.getHours() === now.getHours();
                });
                if (currentHourIndex === -1) currentHourIndex = 0;
                const currentUv = data.hourly.uv_index[currentHourIndex];
                document.getElementById('curr-uv').innerText = currentUv !== undefined ? currentUv.toFixed(1) : '0';
                
                // Sonnenzeiten
                const today = data.daily;
                const formatTime = (isoString) => new Date(isoString).toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                document.getElementById('curr-sunrise').innerText = formatTime(today.sunrise[0]);
                document.getElementById('curr-sunset').innerText = formatTime(today.sunset[0]);

                calculateMoonPhase(settings.lat);

                // Stunden Container (Middle Row)
                const hourlyContainer = document.getElementById('card-hourly');
                hourlyContainer.innerHTML = '';
                
                for (let i = currentHourIndex; i < currentHourIndex + 24; i++) {
                    if(!data.hourly.time[i]) break;
                    const time = new Date(data.hourly.time[i]);
                    const hourStr = time.toLocaleTimeString('de-DE', {hour: '2-digit', minute:'2-digit'});
                    const temp = Math.round(data.hourly.temperature_2m[i]);
                    const isDay = data.hourly.is_day[i] === 1;
                    const e = getEmojiAndText(data.hourly.weather_code[i], isDay).emoji;

                    // Anzeige "Jetzt" für die allererste Stunde
                    const displayTime = (i === currentHourIndex) ? "Jetzt" : hourStr;

                    hourlyContainer.innerHTML += `
                        <div class="hourly-item">
                            <div class="hourly-time">${displayTime}</div>
                            <div class="hourly-emoji">${e}</div>
                            <div class="hourly-temp">${temp}°</div>
                        </div>
                    `;
                }

                // Tage Container (Bottom Row)
                const dailyContainer = document.getElementById('card-daily');
                dailyContainer.innerHTML = '';
                const weekdays = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];
                
                for (let i = 0; i < settings.days; i++) {
                    if(!today.time[i]) break;
                    const date = new Date(today.time[i]);
                    const dayName = i === 0 ? 'Heute' : weekdays[date.getDay()];
                    const tMin = Math.round(today.temperature_2m_min[i]);
                    const tMax = Math.round(today.temperature_2m_max[i]);
                    const e = getEmojiAndText(today.weather_code[i], true).emoji;

                    dailyContainer.innerHTML += `
                        <div class="daily-item">
                            <div class="daily-day">${dayName}</div>
                            <div class="daily-emoji">${e}</div>
                            <div class="daily-temps">
                                <span class="temp-max">${tMax}°</span>
                                <span class="temp-min">${tMin}°</span>
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error("Fehler beim Abrufen der Wetterdaten:", error);
                document.getElementById('curr-desc').innerText = "Fehler beim Laden!";
            }
        }

        // Start
        fetchWeatherData();
        setInterval(fetchWeatherData, 5 * 60 * 1000); // Alle 5 Min aktualisieren
    </script>
</body>
</html>
